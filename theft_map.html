<style>
:root{

body{background:var(--bg);color:var(--text);font-family:"Noto Sans JP",sans-serif;

.bgr{border-color:var(--red);color:var(--red);background:rgba(212,16,32,.07)}
.bgo{border-color:var(--orange);color:var(--orange);background:rgba(216,80,0,.07)}
.bgg{border-color:var(--green);color:var(--green);background:rgba(10,136,56,.07)}

#ctrl{display:flex;align-items:center;gap:6px;padding:5px 14px;
  background:#eaeff6;border-bottom:1px solid var(--bord);flex-shrink:0;flex-wrap:wrap}
.clbl{font-size:.57rem;color:var(--muted);font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;white-space:nowrap}
.tbtn{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:14px;
  border:1px solid var(--bord);background:#fff;color:var(--muted);cursor:pointer;
  font-size:.6rem;font-weight:700;transition:all .15s;
  font-family:"Noto Sans JP",sans-serif;white-space:nowrap}
.tbtn .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tbtn.on{border-color:currentColor;background:rgba(0,0,0,.02)}
.tbtn[data-l="solar"].on{color:var(--solar)}
.tbtn[data-l="agri"].on{color:var(--agri)}
.tbtn[data-l="ai"].on{color:var(--ai)}
.tbtn[data-l="heat"].on{color:var(--red)}

#main{display:flex;flex:1;overflow:hidden;min-height:0}

#nat-wrap{flex:1;display:flex;flex-direction:column;min-width:0;
  position:relative;overflow:hidden}
.phdr{padding:5px 12px;background:#edf1f8;border-bottom:1px solid var(--bord);

.phdr b{color:var(--yellow)}
#nat-svg-wrap{flex:1;overflow:hidden;position:relative}


#leg{position:absolute;bottom:10px;left:10px;background:rgba(255,255,255,.96);
  border:1px solid var(--bord);border-radius:7px;padding:8px 11px;

.lrow{display:flex;align-items:center;gap:5px;margin-bottom:3px}

/* SVGスタイル */
.pref-path{
  stroke:#6a7e98;stroke-width:0.5px;stroke-linejoin:round;
  cursor:pointer;transition:stroke .12s,stroke-width .12s;
}
.pref-path:hover{stroke:#e05800;stroke-width:1.8px}
.pref-label{
  font-family:"Noto Sans JP",sans-serif;font-weight:700;
  pointer-events:none;paint-order:stroke;
  stroke-linejoin:round;stroke-linecap:round;
}
.bubble{pointer-events:none}
.heat-circle{pointer-events:none;mix-blend-mode:multiply}

#tip{position:fixed;pointer-events:none;background:rgba(255,255,255,.98);

#tip.show{opacity:1}
.tn{font-size:.88rem;font-weight:900;margin-bottom:7px;padding-bottom:6px;

.tr{display:flex;justify-content:space-between;align-items:center;

const maxSC = Math.max(...Object.values(THEFT).map(p=>p.sc));
const maxAC = Math.max(...Object.values(THEFT).map(p=>p.ac));
const layers = {solar:true,agri:true,ai:true,heat:false};

function aiCol(s){
  if(s>=85)return"#d41020"; if(s>=65)return"#e05800";
  if(s>=45)return"#c09000"; if(s>=30)return"#0a8838";
  return"#c0ccdc";
}
function aiLbl(s){
  if(s>=85)return"CRITICAL"; if(s>=65)return"HIGH";
  if(s>=45)return"MEDIUM";   if(s>=30)return"LOW";
  return"MINIMAL";
}
function rLbl(r){return["","最低","低","中","高","最高"][r]||"-"}
function bR(v,mx,mn,mxR){return mn+Math.sqrt(v/mx)*(mxR-mn)}
function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── ツールチップ ─────────────────────────────────────────────
const tip = document.getElementById("tip");
function showTip(e,p){
  const col=aiCol(p.ai);
  tip.innerHTML=`
    <div class="tn">${p.name} <small style="color:var(--muted);font-size:.58rem">${p.reg}</small></div>
    <div class="tr"><span class="tk">🤖 AIリスクスコア</span>

    <div class="tbar"><div class="tbarf" style="width:${p.ai}%;background:${col}"></div></div>

    <div class="tr"><span class="tk">　 太陽光リスク</span><span class="tv">${rLbl(p.sr)}</span></div>
    <div class="tr"><span class="tk">🌾 農作物盗難</span>

    <div class="tr"><span class="tk">　 農業リスク</span><span class="tv">${rLbl(p.ar)}</span></div>
    ${p.notes?`<div class="tnote">${p.notes}</div>`:""}`;
  tip.classList.add("show");
  moveTip(e);
}
function moveTip(e){
  tip.style.left=Math.min(e.clientX+14,window.innerWidth-262)+"px";
  tip.style.top=Math.max(8,Math.min(e.clientY-80,window.innerHeight-290))+"px";
}
function hideTip(){tip.classList.remove("show")}

// ══════════════════════════════════════════════════════════
// D3 + TopoJSON マップ描画
// ══════════════════════════════════════════════════════════
let topoData = null;

// jpn-atlasのTopoJSONは 850x680 に投影済み座標
// 都道府県のidは 5桁コード (01000〜47000)
function prefCode(feature){
  // id は "01000" 〜 "47000" 形式
  const raw = String(feature.id || feature.properties?.id || "0");
  return parseInt(raw.slice(0,2)) || 0;
}

function drawNat(topo){
  const wrap = document.getElementById("nat-svg-wrap");
  wrap.innerHTML = "";
  const W = wrap.clientWidth || 800;
  const H = wrap.clientHeight || 560;

  // TopoJSONは850x680に投影済み → SVGのviewBoxでスケール
  const svg = d3.select(wrap).append("svg")
    .attr("width","100%").attr("height","100%")
    .attr("viewBox","0 0 850 680")
    .attr("preserveAspectRatio","xMidYMid meet")
    .style("background","#b8cfe8");

  // 海の縞模様
  for(let i=0;i<9;i++){
    svg.append("line")
      .attr("x1",0).attr("y1",30+i*75)
      .attr("x2",850).attr("y2",32+i*75)
      .attr("stroke","#a0bdd8").attr("stroke-width","0.4").attr("opacity","0.5");
  }

  const defs = svg.append("defs");

  // ヒートマップ用グラデーション
  if(layers.heat){
    Object.entries(THEFT).forEach(([c,p])=>{
      if(p.ai<30||!p._cx) return;
      const r=30+p.ai*0.5;
      const a=Math.min(0.4,p.ai/100*0.55);
      const g=defs.append("radialGradient").attr("id",`hg${c}`)
        .attr("cx",p._cx).attr("cy",p._cy).attr("r",r)
        .attr("gradientUnits","userSpaceOnUse");
      g.append("stop").attr("offset","0%")
        .attr("stop-color","#d41020").attr("stop-opacity",a);
      g.append("stop").attr("offset","100%")
        .attr("stop-color","#d41020").attr("stop-opacity",0);
    });
  }

  if(!topo){ return; }

  const features = topojson.feature(topo, topo.objects.prefectures).features;

  // パス描画
  const pathGen = d3.geoPath();  // 投影済みなので identity

  const prefGroup = svg.append("g").attr("class","prefs");

  features.forEach(feat=>{
    const code = prefCode(feat);
    const p = THEFT[code];
    if(!p) return;

    const col  = layers.ai ? aiCol(p.ai) : "#c0ccdc";
    const alph = layers.ai ? (0.18+p.ai/100*0.75) : 0.58;

    const path = prefGroup.append("path")
      .attr("d", pathGen(feat))
      .attr("class","pref-path")
      .attr("fill", hexA(col,alph))
      .attr("data-code", code);

    path.on("mouseenter", function(event){
      d3.select(this)
        .attr("fill", hexA(col, 1.0))
        .attr("stroke","#e05800")
        .attr("stroke-width","1.8px");
      showTip(event, p);
    })
    .on("mousemove", moveTip)
    .on("mouseleave", function(){
      d3.select(this)
        .attr("fill", hexA(col, alph))
        .attr("stroke","#6a7e98")
        .attr("stroke-width","0.5px");
      hideTip();
    });

    // 重心を記録（バブル用）
    const [cx,cy] = pathGen.centroid(feat);
    p._cx = cx; p._cy = cy;
  });

  // ヒートマップ
  if(layers.heat){
    Object.entries(THEFT).forEach(([c,p])=>{
      if(!p._cx||p.ai<30) return;
      svg.append("circle")
        .attr("cx",p._cx).attr("cy",p._cy)
        .attr("r",30+p.ai*0.5)
        .attr("fill",`url(#hg${c})`)
        .attr("class","heat-circle");
    });
  }

  // 県名ラベル
  features.forEach(feat=>{
    const code = prefCode(feat);
    const p = THEFT[code];
    if(!p||!p._cx) return;
    svg.append("text")
      .attr("class","pref-label")
      .attr("x",p._cx).attr("y",p._cy+4)
      .attr("text-anchor","middle")
      .attr("font-size", p.ai>=80?"9.5":"7.5")
      .attr("fill", p.ai>=50?"#fff":"#2a3858")
      .attr("stroke", p.ai>=50?"rgba(0,0,0,.35)":"rgba(255,255,255,.7)")
      .attr("stroke-width","2.2")
      .text(p.name);
  });

  // CRITICALグロー
  if(layers.ai){
    Object.entries(THEFT).filter(([,p])=>p.ai>=80&&p._cx).forEach(([,p])=>{
      svg.append("circle")
        .attr("cx",p._cx).attr("cy",p._cy).attr("r",24)
        .attr("fill","none").attr("stroke","#d41020")
        .attr("stroke-width","1.5").attr("opacity","0.5")
        .style("filter","blur(3px)").attr("pointer-events","none");
    });
  }

  // 太陽光バブル
  if(layers.solar){
    Object.entries(THEFT).filter(([,p])=>p.sc>=60&&p._cx).forEach(([,p])=>{
      const r=bR(p.sc,maxSC,5,28);
      svg.append("circle").attr("class","bubble")
        .attr("cx",p._cx-10).attr("cy",p._cy-10).attr("r",r)
        .attr("fill","#e05800").attr("fill-opacity","0.72")
        .attr("stroke","#fff").attr("stroke-width","0.6");
    });
  }

  // 農業バブル
  if(layers.agri){
    Object.entries(THEFT).filter(([,p])=>p.ac>=90&&p._cx).forEach(([,p])=>{
      const r=bR(p.ac,maxAC,3,13);
      svg.append("circle").attr("class","bubble")
        .attr("cx",p._cx+9).attr("cy",p._cy-8).attr("r",r)
        .attr("fill","#0a8838").attr("fill-opacity","0.68")
        .attr("stroke","#fff").attr("stroke-width","0.4");
    });
  }
}

// ── コントロール ──────────────────────────────────────────────
function tog(btn){
  const l=btn.dataset.l;
  layers[l]=!layers[l];
  btn.classList.toggle("on",layers[l]);
  drawNat(topoData);
}

// ── データ読み込み ────────────────────────────────────────────
const TOPO_URLS = [
  "https://unpkg.com/jpn-atlas@1.0.2/japan/japan.json",
  "https://cdn.jsdelivr.net/npm/jpn-atlas@1.0.2/japan/japan.json",
];

async function loadTopo(){
  const status=document.getElementById("status");
  for(const url of TOPO_URLS){
    try{
      status.textContent="読み込み中…";
      const res=await fetch(url);
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data=await res.json();
      status.textContent=`✅ 国土地理院GeoJSON取得完了`;
      return data;
    }catch(e){
      console.warn("Failed:",url,e);
    }
  }
  status.textContent="⚠️ データ取得失敗";
  return null;
}

async function init(){
  topoData = await loadTopo();
  drawNat(topoData);
}

init();
window.addEventListener("resize",()=>{ drawNat(topoData); });
</script>
