<style>
  :root {
    --navy: #0f2342;
    --navy2: #1b3a5c;
    --teal: #1e7b6a;
    --teal-light: #2a9d87;
    --gold: #c8922a;
    --gold-light: #e8b94a;
    --cream: #f7f4ef;
    --white: #ffffff;
    --gray: #8a9ab0;
    --red: #c0392b;
    --amber: #d68910;
    --green: #1a7a4a;
    --border: rgba(255,255,255,0.10);
    --panel: rgba(255,255,255,0.04);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── GRID BACKGROUND ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(30,123,106,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,123,106,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* hex mesh overlay */
  body::after {
    content: '';
    position: fixed;
    top: -10%; left: -10%;
    width: 120%; height: 120%;
    background: radial-gradient(ellipse 80% 60% at 70% 20%, rgba(200,146,42,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 10% 80%, rgba(30,123,106,0.10) 0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ─── HEADER ─── */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 56px;
  }
  .logo-text {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.15;
    color: var(--white);
    text-decoration: none;
  }
  .logo-text span { color: var(--gold); }
  .logo-text small {
    display: block;
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.32em;
    color: var(--gray);
    margin-top: 2px;
  }
  .badge {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 4px 10px;
    border-radius: 2px;
    text-transform: uppercase;
  }

  /* ─── HERO ─── */
  .hero {
    text-align: center;
    margin-bottom: 64px;
    animation: fadeUp 0.8s ease both;
  }
  .hero-eyebrow {
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.22em;
    color: var(--teal-light);
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .hero-eyebrow::before,
  .hero-eyebrow::after {
    content: '';
    display: block;
    width: 40px;
    height: 1px;
    background: var(--teal-light);
    opacity: 0.6;
  }
  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(26px, 4.5vw, 40px);
    font-weight: 400;
    line-height: 1.35;
    color: var(--white);
    margin-bottom: 18px;
    letter-spacing: 0.01em;
  }
  .hero h1 em {
    color: var(--gold-light);
    font-style: normal;
    display: block;
    font-size: 0.78em;
    margin-bottom: 4px;
  }
  .hero-sub {
    font-size: 14px;
    color: var(--gray);
    line-height: 1.8;
    max-width: 520px;
    margin: 0 auto 28px;
  }
  .timer-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(200,146,42,0.12);
    border: 1px solid rgba(200,146,42,0.35);
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 13px;
    color: var(--gold-light);
    font-weight: 500;
  }
  .timer-pill svg { width: 14px; height: 14px; }

  /* ─── PROGRESS BAR ─── */
  .progress-track {
    margin-bottom: 48px;
    animation: fadeUp 0.8s 0.1s ease both;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .progress-label {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--gray);
    text-transform: uppercase;
  }
  .progress-counter {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--teal-light);
  }
  .progress-bar {
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--gold-light));
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
  }

  /* ─── QUESTION CARD ─── */
  .q-stage {
    position: relative;
    min-height: 340px;
  }

  .q-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 44px 48px;
    backdrop-filter: blur(12px);
    display: none;
    animation: cardIn 0.45s cubic-bezier(0.22,1,0.36,1) both;
  }
  .q-card.active { display: block; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateX(32px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes cardOut {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(-32px); }
  }

  .q-num {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--teal-light);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .q-num::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .q-text {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--white);
    margin-bottom: 8px;
  }
  .q-hint {
    font-size: 12px;
    color: var(--gray);
    margin-bottom: 32px;
    line-height: 1.6;
  }

  /* ─── OPTIONS ─── */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 20px;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    background: rgba(255,255,255,0.03);
    position: relative;
    overflow: hidden;
  }
  .opt::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(30,123,106,0.15), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .opt:hover { border-color: rgba(30,123,106,0.5); }
  .opt:hover::before { opacity: 1; }
  .opt.selected {
    border-color: var(--teal-light);
    background: rgba(30,123,106,0.12);
  }
  .opt.selected::before { opacity: 1; }

  .opt-radio {
    width: 18px;
    height: 18px;
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 2px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .opt.selected .opt-radio {
    border-color: var(--teal-light);
    background: var(--teal-light);
  }
  .opt.selected .opt-radio::after {
    content: '';
    width: 6px;
    height: 6px;
    background: white;
    border-radius: 50%;
  }

  .opt-body {}
  .opt-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--white);
    line-height: 1.5;
  }
  .opt-score-hint {
    font-size: 11px;
    color: var(--gray);
    margin-top: 2px;
  }

  /* ─── NAV BUTTONS ─── */
  .q-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 36px;
  }
  .btn-back {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--gray);
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 0;
    transition: color 0.2s;
    text-transform: uppercase;
  }
  .btn-back:hover { color: var(--white); }
  .btn-back:disabled { opacity: 0.2; cursor: default; }

  .btn-next {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--navy);
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    border: none;
    border-radius: 8px;
    padding: 14px 32px;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(200,146,42,0.25);
  }
  .btn-next:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(200,146,42,0.4);
  }
  .btn-next:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ─── RESULT SECTION ─── */
  #result-section { display: none; }

  .result-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    animation: fadeUp 0.6s ease both;
  }

  .result-header {
    padding: 48px 48px 40px;
    text-align: center;
    position: relative;
  }
  .result-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 10%; right: 10%;
    height: 1px;
    background: var(--border);
  }

  .result-icon {
    font-size: 52px;
    margin-bottom: 16px;
    display: block;
    animation: pop 0.5s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes pop {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .result-level {
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .result-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 16px;
    line-height: 1.3;
  }
  .result-score-display {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    margin-bottom: 20px;
    padding: 10px 28px;
    border-radius: 100px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
  }
  .result-score-num {
    font-family: 'Rajdhani', sans-serif;
    font-size: 44px;
    font-weight: 700;
    line-height: 1;
  }
  .result-score-max {
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    color: var(--gray);
  }
  .result-desc {
    font-size: 14px;
    color: var(--gray);
    line-height: 1.8;
    max-width: 480px;
    margin: 0 auto;
  }

  /* score meter */
  .score-meter {
    margin: 24px 0 0;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
    max-width: 400px;
    margin: 20px auto 0;
  }
  .score-meter-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
    width: 0;
  }

  /* ─── CHECKLIST BREAKDOWN ─── */
  .result-body {
    padding: 40px 48px;
  }
  .breakdown-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--gray);
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .breakdown-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .breakdown-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 40px;
  }
  .breakdown-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    font-size: 13px;
  }
  .breakdown-item .bi-label { color: var(--white); }
  .breakdown-item .bi-score {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 4px;
  }
  .bi-score.risk-low { color: #2ecc71; background: rgba(46,204,113,0.12); }
  .bi-score.risk-mid { color: #f39c12; background: rgba(243,156,18,0.12); }
  .bi-score.risk-hi  { color: #e74c3c; background: rgba(231,76,60,0.12); }

  /* ─── CTA BLOCKS ─── */
  .cta-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .cta-primary {
    background: linear-gradient(135deg, #1b5e4f, #2a9d87);
    border: 1px solid rgba(42,157,135,0.4);
    border-radius: 14px;
    padding: 32px 36px;
    text-align: center;
    transition: all 0.25s ease;
    cursor: pointer;
    text-decoration: none;
    display: block;
  }
  .cta-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(30,123,106,0.35); }

  .cta-primary .cta-badge {
    display: inline-block;
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--teal-light);
    background: rgba(30,123,106,0.2);
    border: 1px solid rgba(30,123,106,0.4);
    padding: 3px 10px;
    border-radius: 2px;
    margin-bottom: 12px;
  }
  .cta-primary .cta-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 8px;
  }
  .cta-primary .cta-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .cta-btn-inner {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--white);
    color: var(--teal);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 12px 28px;
    border-radius: 8px;
  }

  .cta-secondary {
    background: rgba(200,146,42,0.08);
    border: 1px solid rgba(200,146,42,0.3);
    border-radius: 14px;
    padding: 28px 36px;
    text-align: center;
    transition: all 0.25s ease;
    cursor: pointer;
    text-decoration: none;
    display: block;
  }
  .cta-secondary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(200,146,42,0.2); border-color: rgba(200,146,42,0.55); }

  .cta-secondary .cta-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--gold-light);
    margin-bottom: 8px;
  }
  .cta-secondary .cta-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    line-height: 1.6;
    margin-bottom: 18px;
  }
  .cta-ghost-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(200,146,42,0.5);
    color: var(--gold-light);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 24px;
    border-radius: 8px;
  }

  .cta-tertiary {
    text-align: center;
    padding: 20px;
    font-size: 13px;
    color: var(--gray);
  }
  .cta-tertiary a {
    color: var(--teal-light);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* ─── REASSURANCE (LOW RISK) ─── */
  .tips-section {
    background: rgba(46,125,106,0.08);
    border: 1px solid rgba(30,123,106,0.2);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 28px;
  }
  .tips-section h4 {
    font-size: 14px;
    font-weight: 700;
    color: var(--teal-light);
    margin-bottom: 14px;
  }
  .tips-section ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tips-section ul li {
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    padding-left: 18px;
    position: relative;
    line-height: 1.6;
  }
  .tips-section ul li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: var(--teal-light);
    font-weight: 700;
  }

  /* ─── RESTART ─── */
  .restart-link {
    display: block;
    text-align: center;
    margin-top: 32px;
    font-size: 12px;
    color: var(--gray);
    cursor: pointer;
    transition: color 0.2s;
    text-decoration: underline;
    text-underline-offset: 3px;
    background: none;
    border: none;
    width: 100%;
  }
  .restart-link:hover { color: var(--white); }

  /* ─── FOOTER ─── */
  .site-footer {
    text-align: center;
    padding: 48px 0 32px;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.05em;
    line-height: 1.8;
    border-top: 1px solid var(--border);
    margin-top: 64px;
  }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    .q-card { padding: 28px 24px; }
    .result-header { padding: 36px 24px 32px; }
    .result-body { padding: 28px 24px; }

  }
</style>
</head>
<body>

<div class="wrap">

  <!-- HEADER -->
  <header class="site-header">
    <a href="index.html" class="logo-text">フラクタル・<span>グリーン</span><small>FRACTAL GREEN</small></a>
    <span class="badge">無料 · 60秒</span>
  </header>

  <!-- QUIZ SECTION -->
  <div id="quiz-section">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-eyebrow">安全基準適合診断</div>
      <h1>
        <em>太陽光発電所</em>
        安全基準適合<br>60秒チェック
      </h1>
      <p class="hero-sub">
        設備の現状を8つの質問で確認します。<br>
        スコアに基づいた具体的なアドバイスと、<br>必要に応じた専門家サポートをご案内します。
      </p>
      <div class="timer-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        所要時間：約60秒
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="progress-track">
      <div class="progress-info">
        <span class="progress-label">診断の進捗</span>
        <span class="progress-counter" id="prog-counter">1 / 8</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="prog-fill"></div>
      </div>
    </div>

    <!-- QUESTION STAGE -->
    <div class="q-stage" id="q-stage"></div>

    <!-- NAV -->
    <div class="q-nav">
      <button class="btn-back" id="btn-back" onclick="goBack()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        戻る
      </button>
      <button class="btn-next" id="btn-next" onclick="goNext()" disabled>
        次へ
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

  </div><!-- /quiz-section -->

  <!-- RESULT SECTION -->
  <div id="result-section"></div>

  <!-- FOOTER -->
  <footer class="site-footer">
    本診断は安全基準の参考情報提供を目的とするものです。診断結果は現地調査の代替ではありません。<br>
    © 2025 フラクタル・グリーン　|　info@fractal-green-project.jp　|　<a href="privacy.html" style="color:inherit;">プライバシーポリシー</a>
  </footer>

</div><!-- /wrap -->

<script>
// =============================================
// QUIZ DATA
// =============================================
const questions = [
  {
    id: 1,
    text: "発電所の設置からどのくらい経過していますか？",
    hint: "設置年数が長いほど、設備の経年劣化や防犯基準の変化が生じます。",
    options: [
      { label: "3年未満", sub: "比較的新しく、最新基準に準拠している可能性が高い", score: 0 },
      { label: "3〜7年", sub: "中期段階。設備点検の適切なタイミングです", score: 5 },
      { label: "7〜10年", sub: "経年変化が生じやすい時期です", score: 12 },
      { label: "10年以上", sub: "設備・基準の両面で確認が推奨されます", score: 18 },
    ]
  },
  {
    id: 2,
    text: "発電所周囲のフェンス・囲いの状況を教えてください。",
    hint: "フェンスは第一の物理的防犯ラインです。",
    options: [
      { label: "高さ1.5m以上のフェンスが周囲全体に設置されている", sub: "推奨基準を満たしています", score: 0 },
      { label: "フェンスはあるが、一部に隙間や損傷がある", sub: "補修が推奨されます", score: 8 },
      { label: "低いフェンスまたは簡易な囲いのみ", sub: "改善を検討してください", score: 15 },
      { label: "フェンス・囲いは設置されていない", sub: "優先的な対応が必要です", score: 20 },
    ]
  },
  {
    id: 3,
    text: "防犯カメラ・センサーライトの設置状況は？",
    hint: "記録・威嚇の両機能が、不審者の抑止に有効です。",
    options: [
      { label: "防犯カメラとセンサーライトの両方が設置されている", sub: "両機能がそろっています", score: 0 },
      { label: "どちらか一方のみ設置されている", sub: "もう一方の追加を検討してください", score: 6 },
      { label: "設置はあるが、稼働・録画を未確認", sub: "動作確認を推奨します", score: 12 },
      { label: "設置されていない", sub: "対策の検討をお勧めします", score: 18 },
    ]
  },
  {
    id: 4,
    text: "遠隔監視システムの導入状況を教えてください。",
    hint: "リアルタイムの発電量監視と異常検知が管理の基盤です。",
    options: [
      { label: "遠隔監視システムを導入しており、定期的に確認している", sub: "良好な管理体制です", score: 0 },
      { label: "システムはあるが、確認が不定期", sub: "確認頻度の見直しを推奨します", score: 5 },
      { label: "発電量のみ確認可能（防犯機能なし）", sub: "機能拡張を検討してください", score: 10 },
      { label: "遠隔監視は導入していない", sub: "導入を検討されることをお勧めします", score: 15 },
    ]
  },
  {
    id: 5,
    text: "発電所の立地環境に最も近いものを選んでください。",
    hint: "立地は不審者の目に触れやすさや緊急対応速度に直結します。",
    options: [
      { label: "住宅地や商業施設に隣接・人の往来が多い", sub: "視認性が高く、抑止効果があります", score: 0 },
      { label: "農村部・田園地帯（人は少ないが道路に近い）", sub: "定期的な見回りが有効です", score: 8 },
      { label: "山間部・山林に隣接・人通りが少ない", sub: "より高い防犯対策が推奨されます", score: 14 },
      { label: "無人地帯・管理者が現地に来ることが月1回以下", sub: "総合的な対策の見直しを推奨します", score: 18 },
    ]
  },
  {
    id: 6,
    text: "盗難・動産保険への加入状況を教えてください。",
    hint: "保険は被害後の資産回復に不可欠なセーフティネットです。",
    options: [
      { label: "盗難・動産保険に加入しており、補償内容を把握している", sub: "安心の備えがあります", score: 0 },
      { label: "保険に加入しているが、詳細を把握していない", sub: "補償内容の再確認を推奨します", score: 5 },
      { label: "火災保険のみで盗難補償は不明", sub: "補償範囲の確認が必要です", score: 12 },
      { label: "保険未加入", sub: "加入をご検討されることをお勧めします", score: 18 },
    ]
  },
  {
    id: 7,
    text: "O&M（運転・保守）会社との契約状況は？",
    hint: "定期的な専門家の目が早期異常発見につながります。",
    options: [
      { label: "O&M会社と契約があり、定期点検を実施している", sub: "適切な保守体制です", score: 0 },
      { label: "スポット点検のみ（定期契約なし）", sub: "定期点検の検討を推奨します", score: 6 },
      { label: "自社で管理しているが、専門家点検は未実施", sub: "専門家の確認を推奨します", score: 12 },
      { label: "特に管理体制はない", sub: "管理体制の整備を推奨します", score: 16 },
    ]
  },
  {
    id: 8,
    text: "専門家による安全・防犯点検を最後に受けたのはいつですか？",
    hint: "設備の変化を専門家の目で確認することが重要です。",
    options: [
      { label: "1年以内に受けたことがある", sub: "適切な確認頻度です", score: 0 },
      { label: "1〜3年前に受けたことがある", sub: "次回確認を検討するタイミングです", score: 5 },
      { label: "3年以上前、または記憶が不明確", sub: "確認を推奨します", score: 12 },
      { label: "一度も受けたことがない", sub: "専門家による現状確認を推奨します", score: 16 },
    ]
  },
];

// =============================================
// STATE
// =============================================
let current = 0;
let answers = new Array(questions.length).fill(null);

// =============================================
// INIT
// =============================================
document.addEventListener('DOMContentLoaded', () => {
  renderQuestion(0);
  updateProgress();
});

// =============================================
// RENDER QUESTION
// =============================================
function renderQuestion(idx) {
  const stage = document.getElementById('q-stage');
  const q = questions[idx];

  const card = document.createElement('div');
  card.className = 'q-card active';
  card.id = 'qcard-' + idx;

  const optHtml = q.options.map((opt, i) => `
    <div class="opt" data-idx="${i}" data-score="${opt.score}" onclick="selectOption(this, ${i})">
      <div class="opt-radio"></div>
      <div class="opt-body">
        <div class="opt-label">${opt.label}</div>
        <div class="opt-score-hint">${opt.sub}</div>
      </div>
    </div>
  `).join('');

  card.innerHTML = `
    <div class="q-num">Q${q.id} / ${questions.length}</div>
    <div class="q-text">${q.text}</div>
    <div class="q-hint">${q.hint}</div>
    <div class="options">${optHtml}</div>
  `;

  // restore selection
  if (answers[idx] !== null) {
    setTimeout(() => {
      const opts = card.querySelectorAll('.opt');
      opts[answers[idx].optIdx].classList.add('selected');
      document.getElementById('btn-next').disabled = false;
    }, 50);
  }

  stage.innerHTML = '';
  stage.appendChild(card);
}

// =============================================
// SELECT OPTION
// =============================================
function selectOption(el, optIdx) {
  document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  answers[current] = {
    optIdx,
    score: parseInt(el.dataset.score),
    label: questions[current].options[optIdx].label,
    question: questions[current].text,
  };
  document.getElementById('btn-next').disabled = false;
}

// =============================================
// NAVIGATION
// =============================================
function goNext() {
  if (answers[current] === null) return;

  if (current < questions.length - 1) {
    current++;
    renderQuestion(current);
    updateProgress();
    document.getElementById('btn-next').disabled = answers[current] === null;
  } else {
    showResult();
  }
}

function goBack() {
  if (current > 0) {
    current--;
    renderQuestion(current);
    updateProgress();
    document.getElementById('btn-next').disabled = answers[current] === null;
  }
}

function updateProgress() {
  const pct = (current / questions.length) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-counter').textContent = (current + 1) + ' / ' + questions.length;
  document.getElementById('btn-back').disabled = current === 0;

  // last question: change button text
  const btnNext = document.getElementById('btn-next');
  if (current === questions.length - 1) {
    btnNext.innerHTML = `診断結果を見る <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`;
  } else {
    btnNext.innerHTML = `次へ <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`;
  }
}

// =============================================
// RESULT
// =============================================
function showResult() {
  const totalScore = answers.reduce((sum, a) => sum + (a ? a.score : 0), 0);
  const maxScore = questions.reduce((sum, q) => sum + Math.max(...q.options.map(o => o.score)), 0);
  const pct = Math.round((totalScore / maxScore) * 100);

  let level, icon, color, titleText, desc, meterColor;

  if (pct <= 30) {
    level = "✅ 適合レベル";
    icon = "🛡️";
    color = "#2ecc71";
    meterColor = "linear-gradient(90deg, #27ae60, #2ecc71)";
    titleText = "現在の管理体制は良好です";
    desc = "現時点での安全基準への適合度は良好です。この水準を維持するために、年次点検と保険の定期見直しをお続けください。";
  } else if (pct <= 65) {
    level = "⚠️ 確認推奨レベル";
    icon = "⚠️";
    color = "#f39c12";
    meterColor = "linear-gradient(90deg, #f39c12, #e67e22)";
    titleText = "一部の基準で確認が推奨されます";
    desc = "現状の管理体制にはいくつかの確認ポイントがあります。専門家への無料相談から、現在の状況を整理されることをお勧めします。";
  } else {
    level = "🔴 専門家確認推奨レベル";
    icon = "🔍";
    color = "#e74c3c";
    meterColor = "linear-gradient(90deg, #c0392b, #e74c3c)";
    titleText = "専門家による現状確認をお勧めします";
    desc = "資産保全の観点から、専門家による現状確認のご検討をお勧めします。調査を通じて安全基準への適合状況を把握し、必要な対策を優先的に実施することが重要です。";
  }

  // breakdown items
  const riskClass = (score) => {
    if (score <= 3) return 'risk-low';
    if (score <= 10) return 'risk-mid';
    return 'risk-hi';
  };
  const riskLabel = (score, q) => {
    if (score <= 3) return '良好';
    if (score <= 10) return '確認推奨';
    return '要対応';
  };

  const breakdownHtml = answers.map((a, i) => `
    <div class="breakdown-item">
      <span class="bi-label">${questions[i].text.replace('？','').replace('。','').slice(0,22)}…</span>
      <span class="bi-score ${riskClass(a.score)}">${riskLabel(a.score)}</span>
    </div>
  `).join('');

  // CTA by level
  let ctaHtml;
  if (pct <= 30) {
    ctaHtml = `
      <div class="tips-section">
        <h4>✓ 現状維持のためのポイント</h4>
        <ul>
          <li>年に1回の専門家による安全確認を継続してください</li>
          <li>保険の補償内容を年次で見直し、カバレッジを確認してください</li>
          <li>O&M会社との定期点検契約で早期異常発見を維持してください</li>
          <li>フェンスや機器の経年変化は定期的に目視確認してください</li>
        </ul>
      </div>
      <div class="cta-section">
        <a href="checklist_fractal_green.pdf" class="cta-primary" target="_blank">
          <div class="cta-badge">無料ダウンロード</div>
          <div class="cta-title">安全基準チェックリストPDFを受け取る</div>
          <div class="cta-sub">発電所の自主点検に使えるチェックリストを<br>無料でお届けします。</div>
          <div class="cta-btn-inner">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            無料でダウンロード
          </div>
        </a>
        <div class="cta-tertiary">
          気になる点がある場合は <a href="survey_detail.html" target="_blank">専門家へ無料相談</a> も受け付けています。
        </div>
      </div>
    `;
  } else if (pct <= 65) {
    ctaHtml = `
      <div class="cta-section">
        <a href="survey_detail.html" class="cta-primary" target="_blank">
          <div class="cta-badge">無料相談受付中</div>
          <div class="cta-title">専門家への無料相談を申し込む</div>
          <div class="cta-sub">診断結果をもとに、現状で確認すべきポイントを<br>専門家が丁寧にご説明します。営業は一切しません。</div>
          <div class="cta-btn-inner">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.2 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l.94-.94a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            無料相談を申し込む（所要15分）
          </div>
        </a>
        <a href="survey_detail.html" class="cta-primary" target="_blank">
          <div class="cta-title">📋 安全基準適合 現地調査について知る</div>
          <div class="cta-sub">調査内容・料金・所要時間など、<br>詳細情報をご確認いただけます。</div>
          <div class="cta-ghost-btn">詳細を確認する →</div>
        </a>
      </div>
    `;
  } else {
    ctaHtml = `
      <div class="cta-section">
        <a href="survey_detail.html" class="cta-primary" target="_blank">
          <div class="cta-badge">調査員による現地調査</div>
          <div class="cta-title">安全基準適合 現地調査を依頼する</div>
          <div class="cta-sub">
            専門の調査員が発電所に訪問し、安全基準への適合状況を確認します。<br>
            保険会社・金融機関へ提出可能な正式調査報告書を発行します。<br>
            <strong style="color:rgba(255,255,255,0.8)">料金：150,000円〜（規模により異なります）</strong>
          </div>
          <div class="cta-btn-inner">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            現地調査を申し込む
          </div>
        </a>
        <a href="survey_detail.html" class="cta-primary" target="_blank">
          <div class="cta-title">📞 まずは無料相談から始める</div>
          <div class="cta-sub">「現地調査の前に話を聞きたい」という方も<br>歓迎します。営業は一切しません。</div>
          <div class="cta-ghost-btn">無料相談を申し込む →</div>
        </a>
        <div class="cta-tertiary">
          <a href="survey_detail.html">安全基準適合調査とは？詳細を見る</a>
        </div>
      </div>
    `;
  }

  const resultHtml = `
    <div class="result-card">
      <div class="result-header">
        <span class="result-icon">${icon}</span>
        <div class="result-level" style="color:${color}">${level}</div>
        <div class="result-title">${titleText}</div>
        <div class="result-score-display">
          <span class="result-score-num" style="color:${color}">${totalScore}</span>
          <span class="result-score-max"> / ${maxScore}点</span>
        </div>
        <div class="score-meter">
          <div class="score-meter-fill" id="meter-fill" style="background:${meterColor}"></div>
        </div>
        <p class="result-desc" style="margin-top:20px">${desc}</p>
      </div>
      <div class="result-body">
        <div class="breakdown-title">項目別チェック結果</div>
        <div class="breakdown-list">${breakdownHtml}</div>

        <div class="breakdown-title">次のステップ</div>
        ${ctaHtml}
      </div>
    </div>
    <button class="restart-link" onclick="restart()">← 診断をやり直す</button>
  `;

  document.getElementById('quiz-section').style.display = 'none';
  const resultSection = document.getElementById('result-section');
  resultSection.style.display = 'block';
  resultSection.innerHTML = resultHtml;

  gtag('event', 'diagnosis_complete', { score_pct: pct });

  // animate meter
  setTimeout(() => {
    document.getElementById('meter-fill').style.width = pct + '%';
  }, 300);

  // scroll to top
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// =============================================
// RESTART
// =============================================
function restart() {
  current = 0;
  answers = new Array(questions.length).fill(null);
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('result-section').innerHTML = '';
  document.getElementById('quiz-section').style.display = 'block';
  document.getElementById('btn-next').disabled = true;
  renderQuestion(0);
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

</body>
</html>
